spring.application.name=LMS-System

# Spring banner
spring.banner.main-banner-mode=off

# ---------------------------------------------------------------------------
# Datasource — actual credentials live in application-secrets.properties
# which is gitignored and never committed to source control.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/lms
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:20021609}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Mailtrap SMTP (development)
# Replace with a real SMTP provider config for production.
# Actual credentials live in application-secrets.properties.
# ---------------------------------------------------------------------------
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:your-mailtrap-username}
spring.mail.password=${MAIL_PASSWORD:your-mailtrap-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ---------------------------------------------------------------------------
# JWT configuration
#
# jwt.secret  : The HMAC-SHA256 signing key.
#               - Must be at least 32 characters (256 bits) for HS256.
#               - Use a long, random string in production.
#               - Generate one with: openssl rand -base64 64
#               - Set via environment variable JWT_SECRET in CI/production.
#
# jwt.expiration-ms : Token lifetime in milliseconds.
#               - Default: 3600000 = 1 hour.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:changeme-replace-this-in-production-min32chars}
jwt.expiration-ms=3600000

# ---------------------------------------------------------------------------
# Email mode
# console → prints emails to the log (use during development/testing)
# smtp    → sends real emails via the spring.mail config above (production)
# ---------------------------------------------------------------------------
app.email.mode=console
