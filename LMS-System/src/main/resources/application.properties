spring.application.name=LMS-System

# Spring banner
spring.banner.main-banner-mode=off

# Server port — Railway injects PORT dynamically; defaults to 8080 locally
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Datasource — actual credentials live in application-secrets.properties
# which is gitignored and never committed to source control.
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Resend SMTP — sends real emails, free tier 3000/month, no domain needed
# username is always literally "resend"
# MAIL_PASSWORD = your Resend API key from resend.com/api-keys
# ---------------------------------------------------------------------------
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${MAIL_PASSWORD:your-resend-api-key}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true


# ---------------------------------------------------------------------------
# JWT configuration
#
# jwt.secret  : The HMAC-SHA256 signing key.
#               - Must be at least 32 characters (256 bits) for HS256.
#               - Use a long, random string in production.
#               - Generate one with: openssl rand -base64 64
#               - Set via environment variable JWT_SECRET in CI/production.
#
# jwt.expiration-ms : Token lifetime in milliseconds.
#               - Default: 3600000 = 1 hour.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:changeme-replace-this-in-production-min32chars}
jwt.expiration-ms=3600000

# ---------------------------------------------------------------------------
# Email mode
# console → prints emails to the log (use during development/testing)
# smtp    → sends real emails via the spring.mail config above (production)
# ---------------------------------------------------------------------------
app.email.mode=smtp

# ---------------------------------------------------------------------------
# CORS — comma separated list of allowed frontend origins
# Add your Vercel URL here once deployed
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://lms-system-topaz.vercel.app}
